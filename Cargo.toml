[package]
name = "agent-handover"
version = "0.11.0"
edition = "2024"
rust-version = "1.85"
description = "Notion-driven local Codex task runner"
publish = false

[dependencies]
axum = "0.8"
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1.0", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
webpki-root-certs = "1.0"
