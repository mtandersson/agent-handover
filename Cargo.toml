[package]
name = "agent-handover"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "Notion-driven local Codex task runner"
publish = false

[dependencies]
axum = "0.8"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1.0", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
time = { version = "=0.3.55", features = ["parsing"] }
toml = "1.0"
webpki-root-certs = "1.0"
