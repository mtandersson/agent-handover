name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gnu-and-quality:
    name: GNU and quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Git identity
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: nix develop --command cog verify "$PR_TITLE"

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: nix develop --command cog check "$BASE_SHA..$HEAD_SHA"

      - name: Evaluate all checks
        run: nix flake check --no-build

      - name: Run GNU and quality checks
        run: |
          nix build --print-build-logs --no-link \
            .#checks.x86_64-linux.gnu \
            .#checks.x86_64-linux.quality \
            .#checks.x86_64-linux.scripts

  musl:
    name: musl build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build static binary
        run: |
          nix build --print-build-logs --no-link \
            .#checks.x86_64-linux.musl
